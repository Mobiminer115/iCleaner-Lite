name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          rm -rf iCleanerLite.xcodeproj
          xcodegen generate --spec project.yml
          test -f iCleanerLite.xcodeproj/project.pbxproj

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate generated project
        run: |
          xcodebuild -project iCleanerLite.xcodeproj -scheme iCleanerLite -showBuildSettings >/dev/null

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project iCleanerLite.xcodeproj \
            -scheme iCleanerLite \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/iCleanerLite.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/iCleanerLite.app
          zip -qry iCleanerLite-unsigned.ipa Payload
          test -s iCleanerLite-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iCleanerLite-unsigned-ipa
          path: iCleanerLite-unsigned.ipa
          if-no-files-found: error
